apis:
- name: Zus FHIR & Platform API
  description: >-
    Zus FHIR R4 REST API plus Auth Service and Patient History APIs. Implements FHIR R4 (v4.0.1)
    across 128 resource types with instance-level CRUD, transaction Bundles, conditional
    create/update/delete by identifier, and version-aware writes via the Zus-If-Match ETag header.
    OAuth 2.0 bearer authentication; machine-to-machine app clients supported.
  humanURL: https://docs.zushealth.com/docs/fhir-api
  baseURL: https://api.zusapi.com/fhir
  properties:
  - type: APIReference
    url: https://docs.zushealth.com/reference/general
  - type: Documentation
    url: https://docs.zushealth.com/docs/fhir-rest-api-capabilities
  - type: Conformance
    url: conformance/zus-health-fhir-capabilitystatement.json
- name: Zus FHIR GraphQL API (FQS)
  description: >-
    The Zus FHIR Query Service (FQS) is a read-only GraphQL API over the FHIR data model, exposed at
    a single endpoint. Supports UPID-scoped (one-human) and builder-scoped queries across resource
    types in the Designated Record Set. Uses the same OAuth 2.0 bearer token as the REST API. Beta.
  humanURL: https://docs.zushealth.com/docs/graphql-api
  baseURL: https://fqs.zusapi.com/query
  properties:
  - type: APIReference
    url: https://fqs-docs.zusapi.com/
  - type: Documentation
    url: https://docs.zushealth.com/docs/graphql-api
