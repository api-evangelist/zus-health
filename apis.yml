name: Zus Health
description: >-
  Zus Health is a next-generation shared health data platform that brings information speed to
  healthcare. Its flagship Zus Aggregated Profile (ZAP) consolidates a patient's longitudinal
  medical record — encounters, conditions, medications, labs, and transitions of care sourced from
  EHR, pharmacy, ADT, and lab networks plus TEFCA — into a single, deduplicated, FHIR R4-native
  view accessible via a standalone app, embeddable UI, or API. Zus exposes a FHIR R4 REST API and a
  read-only FHIR GraphQL Query Service (FQS) over 128 FHIR resource types, an Auth Service for
  machine-to-machine and user authentication, Patient History APIs for network enrollment and
  querying, Zushooks event webhooks, and SQL-friendly relational data marts on Snowflake and
  Databricks. The platform is SOC 2 Type 2 compliant and HIPAA-compliant.
